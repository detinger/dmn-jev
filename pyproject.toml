[project]
name = "jevdmn"
version = "0.1.0"
description = "Distilling typed probabilistic decisions (System One models) into verified DMN decision tables with a confidence gate"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Darko Etinger" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "pyarrow>=15",
]

[project.optional-dependencies]
llm = ["system-one-adapter[openai,anthropic]"]
dev = ["pytest>=8"]

[project.scripts]
jevdmn = "jevdmn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevdmn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
