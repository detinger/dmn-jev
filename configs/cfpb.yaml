# Question schema and decision tasks for the CFPB complaint-handling case.
#
# One Jev request per complaint answers every question below (fact questions
# and the two holistic decisions) in parallel and in isolation.
# Wording follows the jev-1.13 guidance: literal, atomic, no arithmetic or dates.
# v2 (2026-10-07): unauthorized excludes own-purchase disputes; credit_card names store cards. See notes/pilot-v1.md.

name: cfpb
model: jev-1.13.0

state:
  # Only the free-text narrative is sent; structured CFPB fields are withheld
  # to simulate an unstructured intake channel (e-mail, chat, call transcript).
  fields:
    complaint: narrative
  max_words: 1500

facts:
  - id: product
    type: choice
    label: Product
    instructions: Which financial product or service is the complaint mainly about?
    criteria:
      credit_report: A credit report, credit score, or a consumer reporting agency
      debt_collection: Collection of a debt by a debt collector or collection agency
      bank_account: A checking or savings account
      credit_card: A credit card, including a store or retail credit card
      prepaid_card: A prepaid card, payroll card, or government benefits card
      money_transfer: A money transfer, payment app, wire, or virtual currency
      mortgage: A mortgage, home equity loan, or mortgage servicing
      vehicle_loan: A vehicle loan or lease
      student_loan: A student loan
      personal_loan: A payday loan, title loan, personal loan, or installment loan
      other: None of the above, or the product cannot be determined

  - id: unauthorized
    type: noul
    label: Unauthorized activity
    instructions: The consumer says that someone else made a transaction, charge, or withdrawal, or opened an account, without the consumer's permission. A dispute about a purchase the consumer made themselves does not count.

  - id: identity_theft
    type: noul
    label: Identity theft
    instructions: The consumer says they are a victim of identity theft, meaning someone used their personal information to open an account, take a loan, or create a debt in their name.

  - id: scam
    type: noul
    label: Scam victim
    instructions: The consumer says a scammer tricked them into sending money or giving access to their account.

  - id: report_dispute
    type: noul
    label: Credit report dispute
    instructions: The consumer disputes information that appears on their credit report.

  - id: collector_contact
    type: noul
    label: Collector contact
    instructions: The consumer complains about calls, letters, or other contact from a debt collector.

  - id: money_lost
    type: noul
    label: Money lost
    instructions: The consumer says they lost money or were charged money that they believe they should not have paid.

  - id: fee_or_interest
    type: noul
    label: Fee or interest
    instructions: The complaint is about a fee, a penalty, or an interest charge.

  - id: refund_requested
    type: noul
    label: Refund requested
    instructions: The consumer asks the company for a refund, a reimbursement, a credit to their account, or the return of their money.

  - id: prior_contact
    type: noul
    label: Prior contact
    instructions: The consumer says they contacted the company about this problem before filing this complaint.

  - id: company_admitted
    type: noul
    label: Company admitted error
    instructions: The consumer says that the company admitted a mistake or promised to fix the problem.

  - id: claim_denied
    type: noul
    label: Claim denied
    instructions: The consumer says the company denied or rejected their dispute, claim, or request.

  - id: funds_blocked
    type: noul
    label: Funds blocked
    instructions: The consumer cannot use their account or their money because the company froze, held, restricted, or closed the account.

  - id: harm
    type: score
    label: Financial harm
    instructions: How much financial harm does the consumer describe?
    criteria:
      - No financial harm is described
      - A small amount of money or a minor inconvenience
      - A significant amount of money or ongoing financial harm
      - Severe harm, such as losing savings, a home, or a vehicle

decisions:
  relief:
    label: Monetary relief
    description: Decide whether the complaint should be resolved with monetary relief (refund or reimbursement).
    subset:
      product_group: [bank_account, card, money_transfer]
    ground_truth: relief
    classes: [relief, no_relief]
    holistic:
      id: relief_holistic
      type: noul
      instructions: Based on the complaint, the company should refund or reimburse money to the consumer.
      true_class: relief
      false_class: no_relief

  routing:
    label: Handling queue
    description: Route the complaint to the team that handles it.
    subset: null
    ground_truth: queue
    classes: [credit_reporting, debt_collection, deposits, cards, payments, mortgage, consumer_loans, fraud]
    holistic:
      id: queue_holistic
      type: choice
      instructions: Which team should handle this complaint?
      criteria:
        credit_reporting: Disputes about credit reports and consumer reporting agencies
        debt_collection: Problems with debt collectors and collection of debts
        deposits: Problems with checking or savings accounts
        cards: Problems with credit cards or prepaid cards
        payments: Problems with money transfers, payment apps, or virtual currency
        mortgage: Problems with mortgages
        consumer_loans: Problems with vehicle, student, payday, or personal loans
        fraud: Fraud, identity theft, or transactions and accounts the consumer did not authorize
